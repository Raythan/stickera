# Optional: deploy Cloudflare trade registry Worker when secrets are configured.
# Does not block PWA deploy if CLOUDFLARE_API_TOKEN is missing.

name: Deploy trade registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/trade-registry/**'

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/trade-registry
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/trade-registry/package-lock.json
      - run: npm ci || npm install
      - name: Wrangler deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

# Optional: deploy Cloudflare trade registry Worker when CLOUDFLARE_API_TOKEN is set.
# Skips gracefully if the secret is missing (does not fail the workflow).

name: Deploy trade registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/trade-registry/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/trade-registry
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/trade-registry/package-lock.json
      - run: npm ci || npm install
      - name: Wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice title=Skip worker deploy::CLOUDFLARE_API_TOKEN secret not configured."
            exit 0
          fi
          npx wrangler deploy

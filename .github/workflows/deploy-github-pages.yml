# Validate, build Stickera as a static PWA, and deploy to GitHub Pages.
# Live URL: https://raythan.github.io/stickera/
# Repo Settings → Pages → Source: GitHub Actions

name: Validate & Deploy PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-pwa
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci || npm install
      - run: npm run validate
      - run: npm test
      - run: npm run validate:structure:strict
        continue-on-error: true

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      ADMIN_CODE_HASH: ${{ secrets.ADMIN_CODE_HASH }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci || npm install
      - run: npm run build:web
        env:
          EXPO_PUBLIC_ADMIN_CODE_HASH: ${{ secrets.ADMIN_CODE_HASH }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
